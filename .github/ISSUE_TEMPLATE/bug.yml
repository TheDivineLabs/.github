name: Bug report
description: Report a reproducible defect
title: "bug: "
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide minimal steps, logs with secrets removed, and version information.
    validations:
      required: true
