name: Update organization profile

on:
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organization-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Render public metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/render-profile.mjs

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets/org-metrics.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh organization metrics [skip ci]"
          git push
